name: Deploy NGINX to Kubernetes

on:
  push:
    branches:
      - main  # Trigger on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up Kubeconfig for Kubernetes access
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube  # Ensure the .kube directory exists
          
          # Check if the secret is being passed correctly
          echo "Checking kubeconfig secret..."  # Debug message
          echo "${{ secrets.KUBECONFIG }}" | head -n 10  # Print the first 10 lines of the kubeconfig (for debugging)

          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config  # Write kubeconfig from secrets

          # Debug the kubeconfig written to the file
          echo "Checking kubeconfig file..."
          cat $HOME/.kube/config  # Print the entire kubeconfig content written to file

      # Step 3: Deploy NGINX to Kubernetes
      - name: Deploy NGINX to Kubernetes
        run: |
          kubectl apply -f k8s-deployment.yaml  # Apply the Kubernetes YAML
          kubectl rollout status deployment/nginx-deployment  # Wait for the deployment to complete

      # Step 4: Confirm the Deployment
      - name: Check deployment status
        run: kubectl get deployments  # Show the status of the deployment
